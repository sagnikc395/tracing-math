seed: 42

# Experiment 2 reads the frozen Experiment 1 activation cache and learned directions. It never
# overwrites Experiment 1. The Colab notebook replaces these paths with Drive-backed equivalents.
experiment1_dir: artifacts/qwen2.5-math-1.5b
output_dir: artifacts/experiment2

model:
  name: Qwen/Qwen2.5-Math-1.5B-Instruct
  device: auto
  dtype: bfloat16
  max_length: 2048

data:
  path: data/processed/processbench.jsonl
  train_fraction: 0.6
  validation_fraction: 0.2
  test_fraction: 0.2

analysis:
  c_values: [0.01, 0.1, 1.0, 10.0]
  max_iter: 2000
  bootstrap_samples: 1000
  confidence_level: 0.95
  threshold_min: 0.05
  threshold_max: 0.95
  threshold_points: 181
  subgroup_min_traces: 20
  pca_dimensions: [1, 2, 4, 8, 16, 32, 64, 128]
  generator_min_test_traces: 20

semantic_extraction:
  save_every: 100
  batch_size: 16

verdict:
  examples_per_class_validation: 64
  examples_per_class_test: 128
  batch_size: 8
  labels: [A, B]

causal:
  examples_per_class: 32
  alphas: [-2.0, -1.0, 0.0, 1.0, 2.0]
  batch_size: 1

