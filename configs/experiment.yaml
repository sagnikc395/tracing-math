seed: 42

model:
  name: Qwen/Qwen2.5-Math-1.5B-Instruct
  device: auto
  dtype: float16
  max_length: 2048

data:
  dataset: Qwen/ProcessBench
  splits: [gsm8k, math, olympiadbench, omnimath]
  output_path: data/processed/processbench.jsonl
  # Keep null for the preregistered run; set an integer only for a limited diagnostic run.
  max_examples_per_split: null

extraction:
  output_dir: artifacts/qwen2.5-math-1.5b
  save_every: 100

probe:
  target: invalid_so_far
  # The L2 family remains the confirmatory probe and the only intervention direction.
  primary_family: l2
  families:
    - {name: l2, penalty: l2}
    - {name: l1, penalty: l1}
    - {name: elastic_net, penalty: elasticnet, l1_ratios: [0.25, 0.5, 0.75]}
  diagnostic_targets: [error_onset]
  train_fraction: 0.6
  validation_fraction: 0.2
  test_fraction: 0.2
  c_values: [0.01, 0.1, 1.0, 10.0]
  max_iter: 2000
  bootstrap_samples: 1000
  pca_dimensions: [1, 2, 4, 8, 16, 32, 64, 128]

analysis:
  threshold_min: 0.05
  threshold_max: 0.95
  threshold_points: 181
  localization_tolerances: [0, 1, 2]
  calibration_bins: 10
  confidence_level: 0.95
  subgroup_min_traces: 20
  # Preserve 1,000 resamples for the primary result; exploratory subgroup/family CIs use 250.
  exploratory_bootstrap_samples: 250

intervention:
  # Alpha is measured in training-set standard deviations along the probe direction.
  alphas: [-4, -2, -1, 0, 1, 2, 4]
  examples_per_class: 128
  random_directions: 20
  correct_answer: " CORRECT"
  incorrect_answer: " INCORRECT"
