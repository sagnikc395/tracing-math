seed: 42

model:
  name: Qwen/Qwen2.5-Math-1.5B-Instruct
  device: auto
  dtype: float16
  max_length: 2048

data:
  dataset: Qwen/ProcessBench
  splits: [gsm8k, math, olympiadbench, omnimath]
  output_path: data/processed/processbench.jsonl
  # Use 25 for a quick smoke run; null uses all 3,400 traces.
  max_examples_per_split: null

extraction:
  output_dir: artifacts/qwen2.5-math-1.5b
  save_every: 100

probe:
  target: invalid_so_far
  train_fraction: 0.6
  validation_fraction: 0.2
  test_fraction: 0.2
  c_values: [0.01, 0.1, 1.0, 10.0]
  max_iter: 2000
  bootstrap_samples: 1000
  pca_dimensions: [1, 2, 4, 8, 16, 32, 64, 128]

intervention:
  # Alpha is measured in training-set standard deviations along the probe direction.
  alphas: [-4, -2, -1, 0, 1, 2, 4]
  examples_per_class: 128
  random_directions: 20
  correct_answer: " CORRECT"
  incorrect_answer: " INCORRECT"
