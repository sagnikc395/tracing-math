# Post-hoc extensions. These settings do not alter the frozen Experiment 1 run.
seed: 42
experiment1_dir: artifacts/experiment1/qwen2.5-math-1.5b
data_path: data/processed/processbench.jsonl
output_dir: artifacts/experiment3_extended
bootstrap_samples: 1000
confidence_level: 0.95

model:
  name: Qwen/Qwen2.5-Math-1.5B-Instruct
  device: auto
  dtype: float16
  max_length: 2048

transition_probe:
  c_values: [0.01, 0.1, 1.0, 10.0]
  max_iter: 2000

boundary_control:
  save_every: 100
  batch_size: 1

counterfactual_patching:
  pairs_path: data/processed/counterfactual_pairs.jsonl
  template_size: 160
  batch_size: 1
