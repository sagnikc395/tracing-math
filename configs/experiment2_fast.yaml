seed: 42

# Fast preview of Experiment 2 analyze-robustness — no code changes.
# Trade accuracy for speed: same code path, ~15-20x faster than configs/experiment2.yaml.
# Use for iteration; rerun with configs/experiment2.yaml for publication numbers.
experiment1_dir: artifacts/qwen2.5-math-1.5b
output_dir: artifacts/experiment2_fast

model:
  name: Qwen/Qwen2.5-Math-1.5B-Instruct
  device: auto
  dtype: bfloat16
  max_length: 2048

data:
  path: data/processed/processbench.jsonl
  train_fraction: 0.6
  validation_fraction: 0.2
  test_fraction: 0.2

analysis:
  c_values: [1.0]              # was [0.01, 0.1, 1.0, 10.0] — 4x fewer LR fits per layer (116 -> 29)
  max_iter: 1000               # was 2000 — liblinear converges much earlier for L2; ~1.5-2x
  bootstrap_samples: 200        # was 1000 — 5x fewer resamples (affects onset_jump, paired control, domain calibration)
  confidence_level: 0.95
  threshold_min: 0.05
  threshold_max: 0.95
  threshold_points: 61         # was 181 — 3x fewer thresholds in choose_threshold
  subgroup_min_traces: 20
  pca_dimensions: [8, 32]      # was [1, 2, 4, 8, 16, 32, 64, 128] — 4x fewer PCA refits
  generator_min_test_traces: 20

semantic_extraction:
  save_every: 100
  batch_size: 16

verdict:
  examples_per_class_validation: 64
  examples_per_class_test: 128
  batch_size: 8
  labels: [A, B]

causal:
  examples_per_class: 32
  alphas: [-2.0, -1.0, 0.0, 1.0, 2.0]
  batch_size: 8
