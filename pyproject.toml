[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tracing_math"
version = "0.1.0"
description = "A Colab-sized causal tracing study of mathematical error detection in language models"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "accelerate>=0.34,<2",
  "click>=8.5.0",
  "datasets>=3.0,<5",
  "matplotlib>=3.8,<4",
  "numpy>=1.26,<3",
  "pandas>=2.1,<3",
  "pyyaml>=6.0,<7",
  "safetensors>=0.4,<1",
  "scikit-learn>=1.4,<2",
  "scipy>=1.11,<2",
  "torch>=2.2,<3",
  "tqdm>=4.66,<5",
  "transformers>=4.45,<5",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<9",
  "ruff>=0.8,<1",
]

[project.scripts]
math-error = "tracing_math.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/tracing_math"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
