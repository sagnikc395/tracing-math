[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "causal-circuits-esm2"
version = "0.1.0"
description = "Causal circuit analysis of ESM-2 zero-shot variant-effect predictions"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0",
  "pandas>=2.2",
  "pyyaml>=6.0",
  "scipy>=1.14",
]

[project.optional-dependencies]
model = [
  "torch>=2.4",
  "transformers>=4.45",
]
dev = [
  "pytest>=8.3",
  "ruff>=0.8",
]

[project.scripts]
causal-circuits = "causal_circuits.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/causal_circuits"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
